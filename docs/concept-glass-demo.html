<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOCKEI — The Glass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* =============================================
       THE GLASS — HOCKEI Concept Demo
       ============================================= */

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-arena: #0a0a09;
      --bg-surface: #141311;
      --bg-elevated: #1c1a17;
      --bg-spotlight: #242220;
      --text-primary: #f5f3ef;
      --text-secondary: #a8a49c;
      --text-tertiary: #6b675f;
      --text-dim: #4a4740;
      --border-subtle: rgba(245, 243, 239, 0.06);
      --border-visible: rgba(245, 243, 239, 0.12);
      --frost: rgba(200, 210, 220, 0.04);
      --frost-line: rgba(200, 215, 230, 0.08);
      --font-display: 'Bebas Neue', sans-serif;
      --font-sans: 'DM Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-arena);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      cursor: default;
      user-select: none;
    }

    /* =============================================
       THE GLASS SURFACE
       ============================================= */

    #arena {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    /* Screen shake */
    @keyframes shake-light {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-2px, 1px); }
      30% { transform: translate(3px, -1px); }
      50% { transform: translate(-1px, 2px); }
      70% { transform: translate(2px, -2px); }
      90% { transform: translate(-1px, 1px); }
    }

    @keyframes shake-heavy {
      0%, 100% { transform: translate(0, 0); }
      5% { transform: translate(-5px, 3px); }
      15% { transform: translate(6px, -4px); }
      25% { transform: translate(-4px, 5px); }
      35% { transform: translate(5px, -3px); }
      50% { transform: translate(-3px, 4px); }
      65% { transform: translate(4px, -5px); }
      80% { transform: translate(-2px, 3px); }
      90% { transform: translate(3px, -2px); }
    }

    #arena.shake-light {
      animation: shake-light 120ms ease-out;
    }

    #arena.shake-heavy {
      animation: shake-heavy 200ms ease-out;
    }

    /* Frost / condensation overlay */
    #frost-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(180, 200, 220, 0.035) 0%, transparent 50%),
        radial-gradient(ellipse at 75% 65%, rgba(180, 200, 220, 0.03) 0%, transparent 40%),
        radial-gradient(ellipse at 40% 85%, rgba(180, 200, 220, 0.025) 0%, transparent 45%),
        radial-gradient(ellipse at 90% 15%, rgba(180, 200, 220, 0.02) 0%, transparent 35%);
    }

    /* Frost edge vignette — like the frame of the glass */
    #glass-frame {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      box-shadow:
        inset 0 0 180px rgba(0, 0, 0, 0.7),
        inset 0 0 60px rgba(0, 0, 0, 0.4);
    }

    /* Diagonal reflection streak across the glass */
    #glass-reflection {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background: linear-gradient(
        135deg,
        transparent 0%,
        transparent 30%,
        rgba(200, 215, 230, 0.015) 35%,
        rgba(200, 215, 230, 0.03) 38%,
        rgba(200, 215, 230, 0.015) 41%,
        transparent 46%,
        transparent 100%
      );
    }

    /* Subtle scratch texture on the glass */
    #glass-scratches {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0.04;
      background-image:
        linear-gradient(23deg, transparent 48%, rgba(255,255,255,0.4) 49%, transparent 50%),
        linear-gradient(167deg, transparent 47%, rgba(255,255,255,0.3) 48%, transparent 49%),
        linear-gradient(78deg, transparent 49%, rgba(255,255,255,0.2) 49.5%, transparent 50%),
        linear-gradient(310deg, transparent 48.5%, rgba(255,255,255,0.3) 49%, transparent 50%),
        linear-gradient(250deg, transparent 49%, rgba(255,255,255,0.2) 49.5%, transparent 50%);
      background-size: 400px 300px, 350px 250px, 500px 400px, 450px 350px, 600px 500px;
    }

    /* =============================================
       IDLE STATE — "WATCHING"
       ============================================= */

    #idle-state {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: opacity 0.8s ease;
    }

    #idle-state.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #idle-state .watching-text {
      font-family: var(--font-display);
      font-size: clamp(4rem, 12vw, 9rem);
      color: var(--text-dim);
      letter-spacing: 0.15em;
      opacity: 0.35;
      animation: watching-breathe 4s ease-in-out infinite;
    }

    @keyframes watching-breathe {
      0%, 100% { opacity: 0.2; filter: blur(0px); }
      50% { opacity: 0.45; filter: blur(0.5px); }
    }

    #idle-state .watching-dots {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    #idle-state .watching-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      animation: dot-pulse 1.8s ease-in-out infinite;
    }

    #idle-state .watching-dot:nth-child(2) { animation-delay: 0.25s; }
    #idle-state .watching-dot:nth-child(3) { animation-delay: 0.5s; }

    @keyframes dot-pulse {
      0%, 100% { opacity: 0.2; transform: translateY(0) scale(1); }
      40% { opacity: 0.8; transform: translateY(-6px) scale(1.2); }
    }

    #idle-state .watching-sub {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 32px;
      opacity: 0.4;
    }

    /* =============================================
       EVENT CARDS — On the glass
       ============================================= */

    #event-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .event-card {
      position: absolute;
      pointer-events: auto;
      opacity: 0;
      will-change: transform, opacity;
    }

    .event-card.impacted {
      animation: card-slam 0.25s cubic-bezier(0.1, 0.8, 0.2, 1.05) forwards;
    }

    .event-card.impacted.is-loss {
      animation: card-slam-heavy 0.3s cubic-bezier(0.1, 0.8, 0.2, 1.02) forwards;
    }

    @keyframes card-slam {
      0% { opacity: 0; transform: scale(1.5) translateZ(0); }
      40% { opacity: 1; transform: scale(0.97) translateZ(0); }
      70% { transform: scale(1.02) translateZ(0); }
      100% { opacity: 1; transform: scale(1) translateZ(0); }
    }

    @keyframes card-slam-heavy {
      0% { opacity: 0; transform: scale(1.8) translateZ(0); }
      30% { opacity: 1; transform: scale(0.95) translateZ(0); }
      55% { transform: scale(1.03) translateZ(0); }
      75% { transform: scale(0.99) translateZ(0); }
      100% { opacity: 1; transform: scale(1) translateZ(0); }
    }

    /* Aging — drift outward, shrink, fade */
    .event-card.aging {
      transition: left 6s ease-out, top 6s ease-out, opacity 4s ease, transform 4s ease;
      opacity: 0.4;
      transform: scale(0.78);
    }

    .event-card.ancient {
      transition: left 8s ease-out, top 8s ease-out, opacity 6s ease, transform 6s ease;
      opacity: 0.18;
      transform: scale(0.6);
    }

    /* --- LOSS CARD --- */
    .loss-card-inner {
      width: clamp(280px, 36vw, 380px);
      background: rgba(20, 19, 17, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-visible);
      border-radius: 14px;
      overflow: hidden;
      box-shadow:
        0 0 40px rgba(0,0,0,0.5),
        0 0 80px var(--team-color-glow, rgba(0,0,0,0.2));
    }

    .loss-bar {
      height: 4px;
      background: linear-gradient(to right, var(--team-color, #999), transparent 85%);
    }

    .loss-glow {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100px;
      background: radial-gradient(ellipse at top left, var(--team-color-dim, rgba(100,100,100,0.1)), transparent 70%);
      pointer-events: none;
      opacity: 0.6;
    }

    .loss-body {
      position: relative;
      padding: 24px;
    }

    .loss-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .loss-defeated {
      font-family: var(--font-display);
      font-size: 1.6rem;
      letter-spacing: 0.06em;
      color: var(--team-color, #f5f3ef);
    }

    .loss-meta {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .loss-score-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 16px;
    }

    .loss-team-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 60px;
    }

    .loss-team-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    /* Loser logo — extreme glitch effect */
    .loss-team-logo.loser {
      filter: saturate(0.5) brightness(0.7);
      animation: glitch-extreme 2s infinite;
      position: relative;
    }

    @keyframes glitch-extreme {
      0%, 85%, 100% { transform: translate(0); filter: saturate(0.5) brightness(0.7); }
      86% { transform: translate(-4px, 2px); filter: saturate(0.5) brightness(0.7) hue-rotate(20deg); }
      88% { transform: translate(4px, -2px); filter: saturate(0.8) brightness(0.9) hue-rotate(-20deg); }
      90% { transform: translate(-3px, -2px); filter: saturate(0.3) brightness(0.5); }
      92% { transform: translate(3px, 2px); filter: saturate(0.6) brightness(0.8) hue-rotate(10deg); }
      94% { transform: translate(-2px, 3px); filter: saturate(0.4) brightness(0.6); }
      96% { transform: translate(2px, -3px); filter: saturate(0.7) brightness(0.8) hue-rotate(-15deg); }
      98% { transform: translate(-1px, 1px); filter: saturate(0.5) brightness(0.7); }
    }

    .loss-team-abbrev {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-tertiary);
      letter-spacing: 0.08em;
    }

    .loss-score-center {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .loss-score-num {
      font-family: var(--font-mono);
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1;
    }

    .loss-score-num.loser { color: var(--text-tertiary); }
    .loss-score-num.winner { color: var(--text-primary); }

    .loss-score-sep {
      font-family: var(--font-mono);
      font-size: 1.8rem;
      font-weight: 300;
      color: var(--text-dim);
      line-height: 1;
    }

    .loss-divider {
      height: 1px;
      background: var(--border-subtle);
      margin-bottom: 12px;
    }

    .loss-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .loss-date {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .loss-streak-banner {
      padding: 8px 16px;
      text-align: center;
      background: var(--team-color-dim, rgba(100,100,100,0.1));
      border-top: 1px solid var(--team-color-glow, rgba(100,100,100,0.2));
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--team-color, #ccc);
      letter-spacing: 0.06em;
    }

    /* --- GOAL CARD (Symmetric design for glass) --- */
    .goal-card-inner {
      width: clamp(240px, 30vw, 300px);
      background: rgba(20, 19, 17, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-visible);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
    }

    .goal-bar {
      height: 3px;
      background: linear-gradient(to right, var(--team-color, #999), transparent 70%);
    }

    .goal-body {
      position: relative;
      padding: 16px 18px;
      text-align: center;
    }

    .goal-glow {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: radial-gradient(ellipse at top, var(--team-color-dim, rgba(100,100,100,0.1)), transparent 70%);
      pointer-events: none;
      opacity: 0.5;
    }

    .goal-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      position: relative;
    }

    .goal-victim-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
      filter: saturate(0.6) brightness(0.7);
      animation: glitch-moderate 3s infinite;
    }

    @keyframes glitch-moderate {
      0%, 92%, 100% { transform: translate(0); filter: saturate(0.6) brightness(0.7); }
      93% { transform: translate(-2px, 1px); filter: saturate(0.6) brightness(0.7) hue-rotate(15deg); }
      95% { transform: translate(2px, -1px); filter: saturate(0.7) brightness(0.8) hue-rotate(-10deg); }
      97% { transform: translate(-1px, -1px); filter: saturate(0.5) brightness(0.6); }
      99% { transform: translate(1px, 1px); filter: saturate(0.6) brightness(0.7); }
    }

    .goal-label {
      font-family: var(--font-display);
      font-size: 1.15rem;
      color: var(--team-color, #ccc);
      letter-spacing: 0.04em;
    }

    .goal-meta-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .goal-period {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-tertiary);
    }

    .goal-badge {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .goal-badge.pp {
      background: rgba(255, 184, 28, 0.2);
      color: #FFB81C;
    }

    .goal-badge.shg {
      background: rgba(220, 40, 60, 0.25);
      color: #ff6b6b;
    }

    .goal-scorer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.8rem;
    }

    .goal-scorer-logo {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    .goal-scorer-name {
      color: var(--text-primary);
      font-weight: 500;
    }

    .goal-shot-type {
      color: var(--text-tertiary);
    }

    /* =============================================
       CRACK EFFECTS — SVG overlays
       ============================================= */

    .crack-effect {
      position: absolute;
      pointer-events: none;
      z-index: 15;
      opacity: 0;
    }

    .crack-effect.active {
      animation: crack-appear 0.08s ease-out forwards, crack-fade 3s 0.3s ease-out forwards;
    }

    .crack-effect.ghost {
      opacity: 0.035 !important;
      animation: none;
    }

    @keyframes crack-appear {
      from { opacity: 0; transform: scale(0.5); }
      to { opacity: 0.7; transform: scale(1); }
    }

    @keyframes crack-fade {
      to { opacity: 0.04; }
    }

    /* Heavy cracks for losses */
    .crack-effect.heavy.active {
      animation: crack-appear-heavy 0.06s ease-out forwards, crack-fade-heavy 4s 0.5s ease-out forwards;
    }

    @keyframes crack-appear-heavy {
      from { opacity: 0; transform: scale(0.3); }
      to { opacity: 0.85; transform: scale(1); }
    }

    @keyframes crack-fade-heavy {
      to { opacity: 0.06; }
    }

    /* Flash on heavy impact */
    .impact-flash {
      position: absolute;
      pointer-events: none;
      z-index: 14;
      border-radius: 50%;
      opacity: 0;
    }

    .impact-flash.active {
      animation: flash-burst 0.4s ease-out forwards;
    }

    @keyframes flash-burst {
      0% { opacity: 0.6; transform: scale(0.2); }
      100% { opacity: 0; transform: scale(1); }
    }

    /* =============================================
       BOTTOM RAIL — The Boards
       ============================================= */

    #boards {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 60;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 20px;
      background: linear-gradient(to top, #0e0d0b 0%, #161412 60%, transparent 100%);
    }

    #boards::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(to right, transparent, var(--border-visible), transparent);
    }

    .board-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .board-team:hover {
      background: rgba(245, 243, 239, 0.04);
    }

    .board-team.active {
      background: rgba(245, 243, 239, 0.06);
    }

    .board-team.active::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2px;
      border-radius: 1px;
      background: var(--text-secondary);
    }

    .board-team-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
      transition: filter 0.2s;
    }

    .board-team:not(.active) .board-team-logo {
      filter: saturate(0.5) brightness(0.6);
    }

    .board-team-label {
      font-family: var(--font-mono);
      font-size: 0.55rem;
      font-weight: 600;
      color: var(--text-tertiary);
      letter-spacing: 0.1em;
    }

    .board-team.active .board-team-label {
      color: var(--text-secondary);
    }

    /* ALL button */
    .board-all {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--text-tertiary);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-right: 8px;
    }

    .board-all:hover { background: rgba(245, 243, 239, 0.04); }
    .board-all.active {
      color: var(--text-secondary);
      background: rgba(245, 243, 239, 0.06);
    }

    /* =============================================
       TOP BAR
       ============================================= */

    #top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 60;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: linear-gradient(to bottom, rgba(10,10,9,0.9) 0%, transparent 100%);
    }

    #top-bar .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #top-bar .logo-mark {
      width: 24px;
      height: 24px;
      opacity: 0.5;
    }

    #top-bar .logo-text {
      font-family: var(--font-display);
      font-size: 1.3rem;
      letter-spacing: 0.15em;
      color: var(--text-dim);
    }

    #top-bar .right-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(239, 68, 68, 0.1);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .live-indicator.visible {
      opacity: 1;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      animation: live-blink 1.5s ease-in-out infinite;
    }

    @keyframes live-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .live-label {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      font-weight: 700;
      color: #ef4444;
      letter-spacing: 0.12em;
    }

    /* Simulate button */
    .sim-btn {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 14px;
      border: 1px solid var(--border-visible);
      border-radius: 6px;
      background: rgba(20, 19, 17, 0.6);
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sim-btn:hover {
      color: var(--text-secondary);
      border-color: var(--text-tertiary);
      background: rgba(28, 26, 23, 0.8);
    }

    .sim-btn:active {
      transform: scale(0.96);
    }

    .sim-btn.running {
      color: var(--text-tertiary);
      pointer-events: none;
    }

    /* =============================================
       EVENT COUNTER
       ============================================= */

    #event-counter {
      position: fixed;
      top: 64px;
      right: 24px;
      z-index: 55;
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #event-counter.visible {
      opacity: 1;
    }

    /* =============================================
       RESPONSIVE
       ============================================= */

    @media (max-width: 600px) {
      /* Mobile: stacked feed layout */
      #event-layer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 70px 16px 80px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .event-card {
        position: relative !important;
        left: auto !important;
        top: auto !important;
        flex-shrink: 0;
      }

      /* No aging drift on mobile — cards stay in place */
      .event-card.aging,
      .event-card.ancient {
        opacity: 1;
        transform: scale(1);
      }

      .loss-card-inner {
        width: calc(100vw - 32px);
        max-width: 360px;
      }
      .goal-card-inner {
        width: calc(100vw - 32px);
        max-width: 360px;
      }

      #boards {
        height: 56px;
        gap: 2px;
        padding: 0 12px;
      }
      .board-team { padding: 6px 8px; }
      .board-team-logo { width: 20px; height: 20px; }
      .board-team-label { font-size: 0.5rem; }

      .board-all {
        padding: 6px 10px;
        font-size: 0.55rem;
      }

      #idle-state .watching-text { font-size: 3rem; }
      #idle-state .watching-sub { font-size: 0.65rem; }

      #top-bar { height: 48px; padding: 0 16px; }
      #top-bar .logo-text { font-size: 1.1rem; }

      #event-counter { top: 56px; right: 16px; }

      /* Cracks still appear but centered on mobile */
      .crack-effect {
        left: 50% !important;
        transform: translateX(-50%);
      }
    }
  </style>
</head>
<body>

      <span class="board-team-label">BOS</span>
    </div>
  </div>

  <script>
    // =============================================
    // EVENT DATA
    // =============================================

    const events = [
      {
        type: 'goal', team: 'TOR', teamColor: '#023ba6',
        teamColorDim: 'rgba(2, 59, 166, 0.12)', teamColorGlow: 'rgba(2, 59, 166, 0.35)',

      },
      {

        scorer: 'T. Wilson', scorerTeam: 'wsh', period: '2nd', time: '11:08',
        shotType: 'deflection', badge: 'PP'
      },
      {
        type: 'loss', team: 'MTL', teamColor: '#AF1E2D',
        teamColorDim: 'rgba(175, 30, 45, 0.12)', teamColorGlow: 'rgba(175, 30, 45, 0.35)',
        opponent: 'WSH', opponentAbbrev: 'wsh', teamScore: 1, opponentScore: 4, streak: null
      },
      {
        type: 'goal', team: 'TOR', teamColor: '#023ba6',
        teamColorDim: 'rgba(2, 59, 166, 0.12)', teamColorGlow: 'rgba(2, 59, 166, 0.35)',
        scorer: 'J. Beecher', scorerTeam: 'bos', period: '3rd', time: '5:44',

      },
      {
        type: 'goal', team: 'BOS', teamColor: '#FFB81C',
        teamColorDim: 'rgba(255, 184, 28, 0.12)', teamColorGlow: 'rgba(255, 184, 28, 0.35)',
        scorer: 'M. Tkachuk', scorerTeam: 'fla', period: '3rd', time: '12:30',
        shotType: 'tip-in', badge: null
      },
      {
        type: 'loss', team: 'TOR', teamColor: '#023ba6',
        teamColorDim: 'rgba(2, 59, 166, 0.12)', teamColorGlow: 'rgba(2, 59, 166, 0.35)',
        opponent: 'BOS', opponentAbbrev: 'bos', teamScore: 2, opponentScore: 5, streak: 4
      },
      {
        type: 'goal', team: 'BOS', teamColor: '#FFB81C',
        teamColorDim: 'rgba(255, 184, 28, 0.12)', teamColorGlow: 'rgba(255, 184, 28, 0.35)',
        scorer: 'S. Barkov', scorerTeam: 'fla', period: 'OT', time: '2:15',
        shotType: 'wrist shot', badge: null
      },
    ];

    // =============================================
    // STATE
    // =============================================

    let placedEvents = [];
    let eventIndex = 0;
    let simRunning = false;
    let currentFilter = 'all';

    // =============================================
    // CRACK GENERATION
    // =============================================

    function generateCrackSVG(heavy) {
      const numArms = heavy ? Math.floor(Math.random() * 5) + 10 : Math.floor(Math.random() * 4) + 6;
      const size = heavy ? 320 : 180;
      const half = size / 2;
      let paths = '';
      const mainColor = heavy ? 'rgba(210, 225, 240, 0.8)' : 'rgba(200, 215, 230, 0.5)';
      const branchColor = heavy ? 'rgba(200, 215, 230, 0.5)' : 'rgba(200, 215, 230, 0.3)';
      const fineColor = heavy ? 'rgba(200, 215, 230, 0.25)' : 'rgba(200, 215, 230, 0.15)';

      for (let i = 0; i < numArms; i++) {
        const angle = (Math.PI * 2 * i / numArms) + (Math.random() - 0.5) * 0.5;
        const length = (heavy ? 70 : 35) + Math.random() * (heavy ? 90 : 50);
        let d = `M ${half} ${half}`;
        let cx = half, cy = half;
        const segments = heavy ? Math.floor(Math.random() * 3) + 4 : Math.floor(Math.random() * 2) + 3;

        for (let s = 0; s < segments; s++) {
          const segLen = length / segments;
          // Each segment bends slightly
          const bend = (Math.random() - 0.5) * 0.4;
          cx += Math.cos(angle + bend) * segLen;
          cy += Math.sin(angle + bend) * segLen;
          d += ` L ${cx.toFixed(1)} ${cy.toFixed(1)}`;

          // Primary branches
          if (Math.random() > 0.35) {
            const bAngle = angle + (Math.random() > 0.5 ? 1 : -1) * (0.5 + Math.random() * 0.9);
            const bLen = 12 + Math.random() * (heavy ? 35 : 20);
            let bx = cx, by = cy;
            let bd = `M ${cx.toFixed(1)} ${cy.toFixed(1)}`;
            const bSegs = Math.floor(Math.random() * 2) + 1;
            for (let bs = 0; bs < bSegs; bs++) {
              bx += Math.cos(bAngle + (Math.random() - 0.5) * 0.3) * (bLen / bSegs);
              by += Math.sin(bAngle + (Math.random() - 0.5) * 0.3) * (bLen / bSegs);
              bd += ` L ${bx.toFixed(1)} ${by.toFixed(1)}`;
            }
            paths += `<path d="${bd}" fill="none" stroke="${branchColor}" stroke-width="${heavy ? '0.7' : '0.4'}" stroke-linecap="round"/>`;

            // Sub-branches (fine hair cracks)
            if (heavy && Math.random() > 0.5) {
              const sAngle = bAngle + (Math.random() - 0.5) * 1.2;
              const sLen = 8 + Math.random() * 15;
              const sx = bx + Math.cos(sAngle) * sLen;
              const sy = by + Math.sin(sAngle) * sLen;
              paths += `<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${sx.toFixed(1)}" y2="${sy.toFixed(1)}" stroke="${fineColor}" stroke-width="0.4" stroke-linecap="round"/>`;
            }
          }
        }

        // Main arm stroke
        const strokeW = heavy ? (1.0 + Math.random() * 0.6) : (0.5 + Math.random() * 0.4);
        paths += `<path d="${d}" fill="none" stroke="${mainColor}" stroke-width="${strokeW.toFixed(1)}" stroke-linecap="round"/>`;
      }

      // Concentric ring cracks (only for heavy)
      if (heavy) {
        for (let r = 15; r < 45; r += 12 + Math.random() * 10) {
          const arcStart = Math.random() * Math.PI * 2;
          const arcSpan = 0.5 + Math.random() * 1.5;
          const x1 = half + Math.cos(arcStart) * r;
          const y1 = half + Math.sin(arcStart) * r;
          const x2 = half + Math.cos(arcStart + arcSpan) * r;
          const y2 = half + Math.sin(arcStart + arcSpan) * r;
          paths += `<path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${fineColor}" stroke-width="0.5" stroke-linecap="round"/>`;
        }
      }

      // Central impact point — brighter for heavy
      paths += `<circle cx="${half}" cy="${half}" r="${heavy ? 5 : 3}" fill="rgba(220, 235, 250, ${heavy ? 0.6 : 0.35})"/>`;
      if (heavy) {
        paths += `<circle cx="${half}" cy="${half}" r="2" fill="rgba(240, 245, 255, 0.8)"/>`;
      }

      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">${paths}</svg>`;
    }

    // =============================================
    // IMPACT SYSTEM
    // =============================================

    function isMobile() {
      return window.innerWidth <= 600;
    }

    function getImpactPosition(index, total, isLoss) {
      // On mobile, position doesn't matter — CSS handles stacking
      if (isMobile()) {
        return { x: 0, y: 0 };
      }
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const cardW = isLoss ? 380 : 300;
      const cardH = isLoss ? 280 : 90;
      const marginTop = 80;
      const marginBottom = 90;
      const marginSide = 40;

      // Usable area
      const minX = marginSide;
      const maxX = vw - marginSide - cardW;
      const minY = marginTop;
      const maxY = vh - marginBottom - cardH;

      // Bias toward center with jitter
      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;
      const spreadX = (maxX - minX) * 0.4;
      const spreadY = (maxY - minY) * 0.4;

      let bestX, bestY, bestDist = -1;

      // Try several random positions, pick the one farthest from existing cards
      for (let attempt = 0; attempt < 15; attempt++) {
        const angle = Math.random() * Math.PI * 2;
        const r = Math.random();
        let x = centerX + Math.cos(angle) * spreadX * r;
        let y = centerY + Math.sin(angle) * spreadY * r;

        x = Math.max(minX, Math.min(maxX, x));
        y = Math.max(minY, Math.min(maxY, y));

        // Compute minimum distance to all existing cards
        let minDist = Infinity;
        for (const pe of placedEvents) {
          const dx = x - pe.origX;
          const dy = y - pe.origY;
          minDist = Math.min(minDist, Math.sqrt(dx * dx + dy * dy));
        }

        if (minDist > bestDist) {
          bestDist = minDist;
          bestX = x;
          bestY = y;
        }
      }

      return { x: bestX || centerX, y: bestY || centerY };
    }

    function getAgingPosition(origX, origY) {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const centerX = vw / 2;
      const centerY = vh / 2;

      // Push away from center
      const dx = origX - centerX;
      const dy = origY - centerY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const pushDist = 80 + Math.random() * 60;
      const nx = dist > 0 ? dx / dist : (Math.random() - 0.5);
      const ny = dist > 0 ? dy / dist : (Math.random() - 0.5);

      return {
        x: origX + nx * pushDist,
        y: origY + ny * pushDist
      };
    }

    function shakeScreen(heavy) {
      const arena = document.getElementById('arena');
      arena.classList.remove('shake-light', 'shake-heavy');
      void arena.offsetWidth; // force reflow
      arena.classList.add(heavy ? 'shake-heavy' : 'shake-light');
      setTimeout(() => arena.classList.remove('shake-light', 'shake-heavy'), heavy ? 220 : 140);
    }

    function createCrack(x, y, heavy) {
      const layer = document.getElementById('crack-layer');
      const svg = generateCrackSVG(heavy);
      const size = heavy ? 260 : 150;
      const el = document.createElement('div');
      el.className = `crack-effect ${heavy ? 'heavy' : ''}`;
      el.innerHTML = svg;
      el.style.left = (x - size / 2) + 'px';
      el.style.top = (y - size / 2) + 'px';
      el.style.position = 'absolute';
      layer.appendChild(el);

      requestAnimationFrame(() => el.classList.add('active'));

      // Leave ghost
      setTimeout(() => {
        el.classList.remove('active');
        el.classList.add('ghost');
      }, heavy ? 4500 : 3300);
    }

    function createFlash(x, y, color) {
      const layer = document.getElementById('flash-layer');
      const el = document.createElement('div');
      el.className = 'impact-flash';
      el.style.width = '200px';
      el.style.height = '200px';
      el.style.left = (x - 100) + 'px';
      el.style.top = (y - 100) + 'px';
      el.style.background = `radial-gradient(circle, ${color} 0%, transparent 70%)`;
      el.style.position = 'absolute';
      layer.appendChild(el);

      requestAnimationFrame(() => el.classList.add('active'));
      setTimeout(() => el.remove(), 500);
    }

    // =============================================
    // CARD BUILDERS
    // =============================================

    function buildLossCard(evt) {
      const teamLower = evt.team.toLowerCase();
      const oppLower = evt.opponentAbbrev || evt.opponent.toLowerCase();
      return `
        <div class="loss-card-inner" style="--team-color:${evt.teamColor};--team-color-dim:${evt.teamColorDim};--team-color-glow:${evt.teamColorGlow};">
          <div class="loss-bar"></div>
          <div class="loss-glow"></div>
          <div class="loss-body">
            <div class="loss-label-row">
              <span class="loss-defeated">${evt.team} &middot; DEFEATED</span>
              <span class="loss-meta">Final</span>
            </div>
            <div class="loss-score-row">
              <div class="loss-team-side">
                <img src="../public/logos/${teamLower}.png" alt="${evt.team}" class="loss-team-logo loser">
                <span class="loss-team-abbrev">${evt.team}</span>
              </div>
              <div class="loss-score-center">
                <span class="loss-score-num loser">${evt.teamScore}</span>
                <span class="loss-score-sep">&mdash;</span>
                <span class="loss-score-num winner">${evt.opponentScore}</span>
              </div>
              <div class="loss-team-side">
                <img src="../public/logos/${oppLower}.png" alt="${evt.opponent}" class="loss-team-logo">
                <span class="loss-team-abbrev">${evt.opponent}</span>
              </div>
            </div>
            <div class="loss-divider"></div>
            <div class="loss-footer">
              <span class="loss-date">Today</span>
            </div>
          </div>
          ${evt.streak ? `<div class="loss-streak-banner">${evt.streak} consecutive losses</div>` : ''}
        </div>
      `;
    }

    function buildGoalCard(evt) {
      const teamLower = evt.team.toLowerCase();
      return `
        <div class="goal-card-inner" style="--team-color:${evt.teamColor};--team-color-dim:${evt.teamColorDim};--team-color-glow:${evt.teamColorGlow};">
          <div class="goal-bar"></div>
          <div class="goal-glow"></div>
          <div class="goal-body">
            <div class="goal-header">
              <img src="../public/logos/${teamLower}.png" alt="${evt.team}" class="goal-victim-logo">
              <span class="goal-label">GOAL AGAINST ${evt.team}</span>
            </div>
            <div class="goal-meta-row">
              <span class="goal-period">${evt.period} ${evt.time}</span>
              ${evt.badge ? `<span class="goal-badge ${evt.badge.toLowerCase()}">${evt.badge}</span>` : ''}
            </div>
            <div class="goal-scorer-row">
              <img src="../public/logos/${evt.scorerTeam}.png" alt="" class="goal-scorer-logo">
              <span class="goal-scorer-name">${evt.scorer}</span>
              <span class="goal-shot-type">${evt.shotType}</span>
            </div>
          </div>
        </div>
      `;
    }

    // =============================================
    // FIRE AN EVENT
    // =============================================

    function fireEvent(evt, index) {
      const isLoss = evt.type === 'loss';
      const layer = document.getElementById('event-layer');
      const pos = getImpactPosition(index, events.length, isLoss);

      // Create card element
      const card = document.createElement('div');
      card.className = 'event-card';
      card.dataset.team = evt.team;
      card.innerHTML = isLoss ? buildLossCard(evt) : buildGoalCard(evt);
      card.style.left = pos.x + 'px';
      card.style.top = pos.y + 'px';

      // On mobile, prepend so newest is at top; on desktop, append (position is absolute)
      if (isMobile()) {
        layer.prepend(card);
      } else {
        layer.appendChild(card);
      }

      // Calculate impact center (center of the card)
      const cardWidth = isLoss ? 340 : 280;
      const cardHeight = isLoss ? 250 : 80;
      const impactX = pos.x + cardWidth / 2;
      const impactY = pos.y + cardHeight / 2;

      // Apply filter visibility
      if (currentFilter !== 'all' && evt.team !== currentFilter) {
        card.style.display = 'none';
      }

      // Mark loss cards for heavier animation
      if (isLoss) card.classList.add('is-loss');

      // Trigger impact sequence
      requestAnimationFrame(() => {
        // 1. Screen shake
        shakeScreen(isLoss);

        // 2. Crack effect at impact center
        createCrack(impactX, impactY, isLoss);

        // 3. Color flash on losses
        if (isLoss) {
          createFlash(impactX, impactY, evt.teamColorGlow);
        }

        // 4. Card slams in
        requestAnimationFrame(() => {
          card.classList.add('impacted');
        });
      });

      // Age older events (desktop only — mobile is stacked)
      if (!isMobile()) {
        placedEvents.forEach((pe, i) => {
          const age = placedEvents.length - i;
          if (age >= 4) {
            pe.el.classList.add('ancient');
            const ancientPos = getAgingPosition(pe.origX, pe.origY);
            pe.el.style.left = ancientPos.x + 'px';
            pe.el.style.top = ancientPos.y + 'px';
          } else if (age >= 2) {
            pe.el.classList.add('aging');
            const agingPos = getAgingPosition(pe.origX, pe.origY);
            pe.el.style.left = agingPos.x + 'px';
            pe.el.style.top = agingPos.y + 'px';
          }
        });
      }

      placedEvents.push({ el: card, origX: pos.x, origY: pos.y, team: evt.team });

      // Update counter
      const counter = document.getElementById('event-counter');
      const counterNum = document.getElementById('counter-num');
      counter.classList.add('visible');
      counterNum.textContent = placedEvents.length;
    }

    // =============================================
    // SIMULATION
    // =============================================

    function startSimulation() {
      if (simRunning) return;
      simRunning = true;

      const btn = document.getElementById('sim-btn');
      btn.classList.add('running');
      btn.textContent = 'Running...';

      // Hide idle state
      document.getElementById('idle-state').classList.add('hidden');

      // Show live badge
      document.getElementById('live-badge').classList.add('visible');

      // Reset
      document.getElementById('event-layer').innerHTML = '';
      document.getElementById('crack-layer').innerHTML = '';
      document.getElementById('flash-layer').innerHTML = '';
      placedEvents = [];
      eventIndex = 0;

      function fireNext() {
        if (eventIndex >= events.length) {
          simRunning = false;
          btn.classList.remove('running');
          btn.textContent = 'Replay';
          return;
        }

        const evt = events[eventIndex];
        const isLoss = evt.type === 'loss';
        fireEvent(evt, eventIndex);
        eventIndex++;

        // Losses get a longer pause after (dramatic beat)
        const delay = isLoss ? 3500 : 1800 + Math.random() * 1200;
        setTimeout(fireNext, delay);
      }

      // First event after a brief pause
      setTimeout(fireNext, 800);
    }

    // =============================================
    // FILTER
    // =============================================

    function setFilter(team) {
      currentFilter = team;

      // Update board UI
      document.querySelectorAll('.board-team, .board-all').forEach(el => {
        const f = el.dataset.filter;
        if (team === 'all') {
          el.classList.add('active');
        } else {
          el.classList.toggle('active', f === team);
          // Keep "ALL" dimmed but clickable
          if (f === 'all') el.classList.remove('active');
        }
      });

      // Filter events
      placedEvents.forEach(pe => {
        if (team === 'all' || pe.team === team) {
          pe.el.style.display = '';
        } else {
          pe.el.style.display = 'none';
        }
      });
    }

    // =============================================
    // HANDLE RESIZE
    // =============================================

    window.addEventListener('resize', () => {
      // On resize, we just let existing cards stay — they're absolute positioned
      // New events will use the new viewport dimensions
    });
  </script>
</body>
</html>
